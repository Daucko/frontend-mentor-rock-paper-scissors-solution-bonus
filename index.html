<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Score Rules You Picked The House Picked You Win You Lose Play Again -->

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
    <!-- Shared icon defs -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <g id="icon-rock">
          <path
            d="M50 12 C58 12 64 18 64 25 C71 26 76 33 74 41 C80 45 82 54 77 61 C77 71 68 79 57 79 L43 79 C31 79 22 70 22 58 C22 54 23 51 25 48 C22 39 27 29 36 27 C38 18 44 12 50 12 Z"
          />
        </g>
        <g id="icon-paper">
          <rect x="30" y="46" width="40" height="38" rx="16" />
          <rect
            x="24"
            y="15"
            width="13"
            height="38"
            rx="6.5"
            transform="rotate(-10 30.5 34)"
          />
          <rect x="43.5" y="10" width="13" height="42" rx="6.5" />
          <rect
            x="62"
            y="15"
            width="13"
            height="38"
            rx="6.5"
            transform="rotate(10 68.5 34)"
          />
          <rect
            x="10"
            y="46"
            width="26"
            height="16"
            rx="8"
            transform="rotate(-40 23 54)"
          />
        </g>
        <g id="icon-scissors">
          <rect x="32" y="50" width="36" height="34" rx="15" />
          <rect
            x="30"
            y="14"
            width="14"
            height="46"
            rx="7"
            transform="rotate(-16 37 37)"
          />
          <rect
            x="56"
            y="14"
            width="14"
            height="46"
            rx="7"
            transform="rotate(16 63 37)"
          />
        </g>
        <g id="icon-lizard">
          <ellipse
            cx="47"
            cy="47"
            rx="23"
            ry="13"
            transform="rotate(-18 47 47)"
          />
          <circle cx="25" cy="35" r="10" />
          <path d="M65 52 C76 55 83 65 76 76 C71 69 66 63 59 59 Z" />
          <rect
            x="31"
            y="54"
            width="7"
            height="15"
            rx="3.5"
            transform="rotate(22 34.5 61.5)"
          />
          <rect
            x="44"
            y="58"
            width="7"
            height="15"
            rx="3.5"
            transform="rotate(22 47.5 65.5)"
          />
          <rect
            x="19"
            y="47"
            width="7"
            height="14"
            rx="3.5"
            transform="rotate(-25 22.5 54)"
          />
          <rect
            x="56"
            y="38"
            width="7"
            height="14"
            rx="3.5"
            transform="rotate(-15 59.5 45)"
          />
        </g>
        <g id="icon-spock">
          <rect x="30" y="46" width="40" height="38" rx="16" />
          <rect
            x="25"
            y="14"
            width="18"
            height="43"
            rx="8"
            transform="rotate(-9 34 35.5)"
          />
          <rect
            x="57"
            y="14"
            width="18"
            height="43"
            rx="8"
            transform="rotate(9 66 35.5)"
          />
          <rect
            x="13"
            y="44"
            width="25"
            height="16"
            rx="8"
            transform="rotate(-38 25.5 52)"
          />
        </g>
      </defs>
    </svg>

    <div class="app">
      <header class="topbar">
        <div class="title-box">
          <h1>Rock<br />Paper<br />Scissors<br />Lizard<br />Spock</h1>
        </div>
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="scoreValue">0</span>
        </div>
      </header>

      <main>
        <!-- CHOICE SCREEN -->
        <section class="screen active" id="choiceScreen">
          <div class="choices-wrap">
            <!-- <svg
              class="connector"
              viewBox="0 0 100 100"
              preserveAspectRatio="none"
            >
              <line x1="50" y1="12" x2="84" y2="37"></line>
              <line x1="84" y1="37" x2="71" y2="77"></line>
              <line x1="71" y1="77" x2="29" y2="77"></line>
              <line x1="29" y1="77" x2="16" y2="37"></line>
              <line x1="16" y1="37" x2="50" y2="12"></line>
            </svg> -->
            <img src="images/bg-pentagon.svg" alt="" />
            <button
              class="choice-node"
              data-choice="scissors"
              aria-label="Choose scissors"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="images/icon-scissors.svg" alt="" /></span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="paper"
              aria-label="Choose paper"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="/images/icon-paper.svg" alt="" /> </span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="rock"
              aria-label="Choose rock"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="images/icon-rock.svg" alt="" /> </span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="lizard"
              aria-label="Choose lizard"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="images/icon-lizard.svg" alt="" /> </span
              ></span>
            </button>
            <button
              class="choice-node"
              data-choice="spock"
              aria-label="Choose spock"
            >
              <span class="disc"
                ><span class="inner"
                  ><img src="images/icon-spock.svg" alt="" /> </span
              ></span>
            </button>
          </div>
        </section>

        <!-- RESULT SCREEN -->
        <section class="screen" id="resultScreen">
          <div class="result-grid">
            <div class="pick-col">
              <p class="pick-label">You picked</p>
              <div class="pick-stage" id="userStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="userPick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>

            <div class="verdict-col" id="verdictCol">
              <h2 class="verdict-text" id="verdictText"></h2>
              <button class="play-again" id="playAgainBtn">Play again</button>
            </div>

            <div class="pick-col house">
              <p class="pick-label">The house picked</p>
              <div class="pick-stage" id="houseStage">
                <span class="ring"></span><span class="ring"></span
                ><span class="ring"></span>
                <div class="pick-circle" id="housePick">
                  <span class="inner"><svg viewBox="0 0 100 100"></svg></span>
                </div>
              </div>
            </div>
          </div>
        </section>
      </main>

      <button class="rules-btn" id="rulesOpenBtn">Rules</button>
      <footer class="attribution">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by <a href="#">Your Name Here</a>.
      </footer>
    </div>

    <!-- RULES MODAL -->
    <div class="modal-overlay" id="rulesModal">
      <div class="modal">
        <button class="modal-close" id="rulesCloseBtn" aria-label="Close rules">
          <img src="/images/icon-close.svg" alt="" />
        </button>
        <h2>Rules</h2>
        <div class="rules-diagram">
          <img src="/images/image-rules.svg" alt="" />
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
